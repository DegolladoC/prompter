<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self';" />
  <title>Configuración del guion</title>
  <link rel="stylesheet" href="config.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Guion del teleprompter</h1>
      <p class="hint">Escribí el texto directamente o cargalo desde un archivo .txt. Los cambios se guardan automáticamente.</p>
    </header>

    <div class="toolbar">
      <button id="btnLoadFile" type="button">📂 Cargar archivo .txt</button>
      <span id="saveStatus" class="save-status">Sin cambios</span>
    </div>

    <textarea id="scriptText" placeholder="Escribí o pegá aquí el guion de tu presentación…&#10;&#10;Tip: las líneas que empiecen con &quot;- &quot; (guión + espacio) se convierten en marcadores de sección."></textarea>

    <div class="settings-group">
      <div class="slider-row">
        <label for="sliderOpacity">Opacidad del panel</label>
        <input type="range" id="sliderOpacity" min="25" max="100" step="1" value="74">
        <span id="valOpacity" class="slider-val">74%</span>
      </div>
      <div class="slider-row">
        <label for="sliderFontSize">Tamaño de fuente</label>
        <input type="range" id="sliderFontSize" min="16" max="56" step="1" value="30">
        <span id="valFontSize" class="slider-val">30px</span>
      </div>
    </div>

    <footer>
      <span class="footer-hint">Ctrl+Shift+E: abrir config  ·  Ctrl+Shift+C: activar/desactivar click-through</span>
    </footer>
  </div>
  <script src="config.js"></script>
</body>
</html>
